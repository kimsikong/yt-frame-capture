<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>YouTube Frame Capture</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; width: 320px;
    font: 13px/1.45 "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
    background: #fff; color: #0f0f0f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #181818; color: #f1f1f1; }
    .row { border-color: #303030 !important; }
    .card { background: #202020 !important; }
    button.ghost { border-color: #3a3a3a !important; color: #f1f1f1 !important; }
  }
  header { padding: 14px 14px 10px; }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: -.01em; }
  .hint { font-size: 11.5px; opacity: .6; }
  .actions { display: flex; gap: 8px; padding: 0 14px 12px; }
  button {
    flex: 1; padding: 9px 10px; border-radius: 9px; cursor: pointer;
    font: 600 12.5px/1 inherit; border: 1px solid transparent;
    background: #cc0000; color: #fff;
  }
  button.ghost { background: transparent; border-color: #ddd; color: #0f0f0f; }
  button:disabled { opacity: .45; cursor: default; }
  .row { border-top: 1px solid #eee; padding: 10px 14px; }
  .row h2 { font-size: 11px; margin: 0 0 8px; text-transform: uppercase;
            letter-spacing: .06em; opacity: .55; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: #f4f4f4; border-radius: 8px; overflow: hidden;
          cursor: pointer; border: none; padding: 0; display: block; width: 100%; }
  .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #000; }
  .card .meta { padding: 5px 7px 7px; text-align: left; }
  .card .meta b { display: block; font-size: 10.5px; font-weight: 600;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta span { font-size: 10px; opacity: .6; }
  .empty { font-size: 12px; opacity: .55; padding: 4px 0 8px; }
  footer { padding: 10px 14px 14px; }
  footer a { font-size: 11.5px; color: #3ea6ff; text-decoration: none; cursor: pointer; }
  #status { font-size: 11.5px; padding: 0 14px 10px; min-height: 14px; opacity: .75; }
</style>
</head>
<body>
  <header>
    <h1>YouTube Frame Capture</h1>
    <div class="hint">영상 플레이어의 카메라 버튼으로도 캡쳐할 수 있습니다</div>
  </header>

  <div class="actions">
    <button id="shoot">지금 캡쳐</button>
    <button id="copy" class="ghost">클립보드</button>
  </div>
  <div id="status"></div>

  <div class="row">
    <h2>최근 캡쳐</h2>
    <div class="grid" id="recent"></div>
    <div class="empty" id="recent-empty" hidden>아직 캡쳐한 장면이 없습니다.</div>
  </div>

  <footer><a id="opts">설정 열기</a></footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
